use_directory_urls: false
site_url: https://qlerup.github.io/thermostat-pro-timeline/
site_name: Thermostat Pro Timeline
repo_name: qlerup/thermostat-pro-timeline
repo_url: https://github.com/qlerup/thermostat-pro-timeline

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md

  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md

  - Feature guides:
      - card/features/index.md
      - Timeline and room controls: card/features/rooms.md
      - Weekdays: card/features/weekdays.md
      - Profiles: card/features/profiles.md
      - Presence & away: card/features/presence-away.md
      - Holidays: card/features/holidays.md
      - Pause and manual targets: card/features/pause.md
      - Seasonal: card/features/seasonal.md
      - Open Window Detection: card/features/open-window.md
      - Boiler control: card/features/boiler.md
      - Color ranges: card/features/colors.md
      - Storage & backup: card/features/storage.md

  - Card:
      - Configuration: card/configuration.md
      - Examples: card/examples.md
      - Internationalization: card/internationalization.md
  - Integration:
      - Services: integration/services.md
      - API endpoints: integration/api.md

  - Help:
      - Troubleshooting: troubleshooting.md
      - Support: support.md
      - License: license.md

extra_css:
  - styles/guide.css
extra_javascript:
  - scripts/walkthroughs.js
